<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZTE Bypass</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, #382080 0, transparent 35%),
        radial-gradient(circle at 80% 90%, #142d80 0, transparent 35%),
        #070914;
    color: white;
}

.nav {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 7%;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(5,7,18,.7);
    backdrop-filter: blur(15px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: bold;
}

.logoBox {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: linear-gradient(135deg,#287cff,#8d4dff);
}

.main {
    max-width: 850px;
    margin: auto;
    padding: 85px 20px;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 30px;
    background: rgba(90,90,255,.12);
    border: 1px solid rgba(120,110,255,.25);
    color: #aeb8ff;
    font-size: 13px;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(40px,7vw,72px);
    line-height: 1;
    margin-bottom: 20px;
    background: linear-gradient(90deg,#fff,#a7b5ff,#8b62ff);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #a5abc4;
    margin-bottom: 38px;
}

.inputBox {
    padding: 9px;
    display: flex;
    gap: 10px;
    border-radius: 18px;
    background: rgba(15,18,40,.85);
    border: 1px solid rgba(255,255,255,.09);
}

input {
    flex: 1;
    min-width: 0;
    padding: 18px;
    border: 0;
    outline: 0;
    color: white;
    background: transparent;
}

input::placeholder {
    color: #626982;
}

button {
    border: 0;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.start {
    padding: 0 25px;
    border-radius: 13px;
    background: linear-gradient(135deg,#347dff,#814cff);
}

.statusBox {
    display: none;
    margin-top: 25px;
    padding: 28px;
    border-radius: 18px;
    background: rgba(15,18,40,.85);
    border: 1px solid rgba(255,255,255,.09);
}

.spinner {
    width: 45px;
    height: 45px;
    margin: 0 auto 18px;
    border: 4px solid rgba(255,255,255,.12);
    border-top-color: #6b75ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.statusTitle {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.statusText {
    color: #8e96af;
    font-size: 14px;
}

.continueBtn {
    display: none;
    margin: 22px auto 0;
    padding: 14px 28px;
    border-radius: 12px;
    background: linear-gradient(135deg,#347dff,#814cff);
}

.error {
    color: #ff7b8b;
}

@media(max-width:600px) {
    .inputBox {
        flex-direction: column;
    }

    .start {
        height: 52px;
    }
}
</style>
</head>

<body>

<nav class="nav">
    <div class="logo">
        <div class="logoBox">Z</div>
        ZTE Bypass
    </div>
</nav>

<main class="main">

    <div class="badge">⚡ ZTE LINK SYSTEM</div>

    <h1>Get to the link.</h1>

    <p class="subtitle">
        Paste your LootLabs link below to continue.
    </p>

    <div class="inputBox" id="inputBox">

        <input
            id="linkInput"
            type="text"
            placeholder="Paste your LootLabs link..."
            autocomplete="off"
        >

        <button class="start" onclick="startProcess()">
            Continue
        </button>

    </div>

    <div class="statusBox" id="statusBox">

        <div class="spinner" id="spinner"></div>

        <div class="statusTitle" id="statusTitle">
            Loading...
        </div>

        <div class="statusText" id="statusText">
            Please wait...
        </div>

        <button
            class="continueBtn"
            id="continueBtn"
            onclick="continueToDestination()">
            Continue
        </button>

    </div>

</main>

<script>

let destination = "";
let timer = null;

function startProcess() {

    const input = document.getElementById("linkInput");
    const value = input.value.trim();

    if (!value) {
        alert("Please paste a link first.");
        return;
    }

    let url;

    try {

        url = new URL(
            /^https?:\/\//i.test(value)
                ? value
                : "https://" + value
        );

    } catch {

        alert("Invalid URL.");
        return;
    }

    destination = url.href;

    document.getElementById("inputBox").style.display = "none";

    const box = document.getElementById("statusBox");
    box.style.display = "block";

    document.getElementById("spinner").style.display = "block";

    document.getElementById("statusTitle").textContent =
        "Loading...";

    document.getElementById("statusText").textContent =
        "Preparing your link.";

    document.getElementById("continueBtn").style.display =
        "none";

    /*
     * Waiting UI.
     *
     * This does NOT fake LootLabs completion.
     * A real implementation should replace this timer
     * with your server's LootLabs postback status.
     */

    setTimeout(function() {

        document.getElementById("statusTitle").textContent =
            "Waiting...";

        document.getElementById("statusText").textContent =
            "Waiting for the link process to finish.";

    }, 1500);

    /*
     * Demo waiting period.
     * Replace this with a real completion check.
     */

    clearTimeout(timer);

    timer = setTimeout(function() {

        document.getElementById("spinner").style.display =
            "none";

        document.getElementById("statusTitle").textContent =
            "Ready";

        document.getElementById("statusText").textContent =
            "The link is ready to continue.";

        document.getElementById("continueBtn").style.display =
            "inline-block";

    }, 5000);
}


function continueToDestination() {

    if (!destination) {
        return;
    }

    window.location.href = destination;
}

</script>

</body>
</html>
