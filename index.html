<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b18">

<title>ZTE Bypass</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

html, body {
    min-height: 100%;
}

body {
    min-height: 100vh;
    color: #fff;
    background:
        radial-gradient(circle at 50% -10%, #35106e 0%, transparent 40%),
        radial-gradient(circle at 100% 50%, #101e50 0%, transparent 35%),
        linear-gradient(135deg, #05060c, #0a0b18 55%, #070812);
}

/* NAVBAR */

.navbar {
    width: 100%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    background: rgba(5, 6, 14, .72);
    border-bottom: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(15px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 21px;
    font-weight: 700;
}

.logo {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    font-size: 21px;
    font-weight: 800;
    background: linear-gradient(135deg,#2388ff,#6945ff,#a53cff);
    box-shadow: 0 0 28px rgba(105,70,255,.4);
}

/* HERO */

.hero {
    width: 90%;
    max-width: 900px;
    margin: 85px auto 0;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 15px;
    margin-bottom: 20px;
    border-radius: 30px;
    color: #c8baff;
    font-size: 13px;
    background: rgba(111,70,255,.12);
    border: 1px solid rgba(133,92,255,.25);
}

h1 {
    font-size: clamp(40px, 8vw, 72px);
    line-height: 1.04;
    letter-spacing: -2px;
    margin-bottom: 20px;
}

.gradient {
    background: linear-gradient(90deg,#48a6ff,#7355ff,#b247ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    max-width: 650px;
    margin: 0 auto 38px;
    color: #9ca3b8;
    font-size: 16px;
    line-height: 1.6;
}

/* CARD */

.card {
    width: 100%;
    padding: 23px;
    border-radius: 20px;
    background: rgba(16,18,33,.88);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 25px 80px rgba(0,0,0,.38);
    backdrop-filter: blur(15px);
}

/* TABS */

.tabs {
    display: flex;
    gap: 7px;
    margin-bottom: 16px;
}

.tab {
    padding: 10px 16px;
    border: 0;
    border-radius: 9px;
    color: #8e95ab;
    background: transparent;
    cursor: pointer;
    transition: .2s;
}

.tab:hover {
    color: white;
}

.tab.active {
    color: white;
    background: rgba(104,73,255,.2);
}

/* INPUT */

.input-row {
    display: flex;
    gap: 10px;
}

.url-input {
    flex: 1;
    min-width: 0;
    height: 55px;
    padding: 0 17px;
    outline: none;
    border-radius: 12px;
    border: 1px solid #292d43;
    background: #0b0d17;
    color: white;
    font-size: 15px;
    transition: .2s;
}

.url-input::placeholder {
    color: #656b7e;
}

.url-input:focus {
    border-color: #7655ff;
    box-shadow: 0 0 0 3px rgba(118,85,255,.1);
}

/* BUTTON */

.bypass-button {
    height: 55px;
    padding: 0 27px;
    border: 0;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg,#2585ff,#6845ff,#923cff);
    box-shadow: 0 8px 25px rgba(91,70,255,.28);
    cursor: pointer;
    transition: .2s;
    white-space: nowrap;
}

.bypass-button:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
}

.bypass-button:active {
    transform: scale(.98);
}

.bypass-button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

/* RESULT */

.result {
    display: none;
    margin-top: 15px;
    padding: 17px;
    border-radius: 12px;
    background: #090b14;
    border: 1px solid #272b40;
    text-align: left;
    word-break: break-all;
}

.result-title {
    margin-bottom: 9px;
    color: #a990ff;
    font-size: 13px;
    font-weight: 600;
}

.result a {
    color: #63aaff;
    text-decoration: none;
}

.result a:hover {
    text-decoration: underline;
}

.success {
    color: #77e7a1;
}

.error {
    color: #ff7895;
}

.loading {
    color: #aeb6ff;
}

/* SERVICES */

.popular {
    margin-top: 27px;
}

.popular-title {
    margin-bottom: 12px;
    color: #7f879d;
    font-size: 13px;
}

.services {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
}

.service {
    padding: 9px 14px;
    border-radius: 20px;
    border: 1px solid #252941;
    color: #aab1c4;
    background: #111425;
    font-size: 13px;
    cursor: pointer;
    transition: .2s;
}

.service:hover {
    color: white;
    border-color: #654cff;
    background: #171932;
}

/* STATS */

.stats {
    display: flex;
    justify-content: center;
    gap: 55px;
    margin-top: 42px;
}

.stat {
    color: #858ca0;
    font-size: 13px;
}

.stat strong {
    display: block;
    margin-bottom: 5px;
    color: white;
    font-size: 21px;
}

/* MOBILE */

@media (max-width: 650px) {

    .navbar {
        padding: 0 5%;
    }

    .hero {
        margin-top: 55px;
    }

    .card {
        padding: 17px;
    }

    .input-row {
        flex-direction: column;
    }

    .bypass-button {
        width: 100%;
    }

    .stats {
        gap: 25px;
    }

    h1 {
        letter-spacing: -1px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="brand">

        <div class="logo">
            Z
        </div>

        <span>
            ZTE Bypass
        </span>

    </div>

</nav>


<!-- MAIN -->

<main class="hero">

    <div class="badge">
        ⚡ Fast Link Tool
    </div>

    <h1>
        Skip the
        <span class="gradient">wait.</span>
        <br>
        Get to the link.
    </h1>

    <p class="subtitle">
        Paste a URL below and continue to its destination.
    </p>


    <!-- CARD -->

    <div class="card">

        <!-- TABS -->

        <div class="tabs">

            <button
                id="singleTab"
                class="tab active"
                type="button">
                Single
            </button>

            <button
                id="bulkTab"
                class="tab"
                type="button">
                Bulk
            </button>

        </div>


        <!-- INPUT -->

        <div class="input-row">

            <input
                id="urlInput"
                class="url-input"
                type="url"
                placeholder="Paste your URL here..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                id="bypassButton"
                class="bypass-button"
                type="button">
                Continue
            </button>

        </div>


        <!-- RESULT -->

        <div
            id="result"
            class="result">

            <div class="result-title">
                Status
            </div>

            <div id="resultText"></div>

        </div>


        <!-- POPULAR SERVICES -->

        <div class="popular">

            <div class="popular-title">
                Popular services
            </div>

            <div class="services">

                <button
                    class="service"
                    data-name="Linkvertise"
                    type="button">
                    Linkvertise
                </button>

                <button
                    class="service"
                    data-name="Lootlabs"
                    type="button">
                    Lootlabs
                </button>

                <button
                    class="service"
                    data-name="Work.ink"
                    type="button">
                    Work.ink
                </button>

                <button
                    class="service"
                    data-name="Platoboost"
                    type="button">
                    Platoboost
                </button>

                <button
                    class="service"
                    data-name="Other"
                    type="button">
                    Other
                </button>

            </div>

        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <strong>Fast</strong>
            Processing
        </div>

        <div class="stat">
            <strong>24/7</strong>
            Available
        </div>

        <div class="stat">
            <strong>Free</strong>
            To use
        </div>

    </div>

</main>


<script>

/* =====================================
   ELEMENTS
===================================== */

const input =
    document.getElementById("urlInput");

const button =
    document.getElementById("bypassButton");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const singleTab =
    document.getElementById("singleTab");

const bulkTab =
    document.getElementById("bulkTab");


let bulkMode = false;


/* =====================================
   SINGLE TAB
===================================== */

singleTab.addEventListener("click", function () {

    bulkMode = false;

    singleTab.classList.add("active");

    bulkTab.classList.remove("active");

    input.type = "url";

    input.placeholder =
        "Paste your URL here...";

    input.value = "";

    hideResult();

});


/* =====================================
   BULK TAB
===================================== */

bulkTab.addEventListener("click", function () {

    bulkMode = true;

    bulkTab.classList.add("active");

    singleTab.classList.remove("active");

    input.type = "text";

    input.placeholder =
        "Paste URLs separated by commas...";

    input.value = "";

    hideResult();

});


/* =====================================
   CONTINUE BUTTON
===================================== */

button.addEventListener("click", function () {

    if (bulkMode) {

        processBulk();

    } else {

        processSingle();

    }

});


/* =====================================
   ENTER KEY
===================================== */

input.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

        if (bulkMode) {

            processBulk();

        } else {

            processSingle();

        }

    }

});


/* =====================================
   SINGLE URL
===================================== */

function processSingle() {

    const value =
        input.value.trim();


    if (!value) {

        showError(
            "Please enter a URL first."
        );

        return;
    }


    let url;


    try {

        url = new URL(value);

    } catch {

        showError(
            "Please enter a valid URL."
        );

        return;
    }


    if (
        url.protocol !== "http:" &&
        url.protocol !== "https:"
    ) {

        showError(
            "Only HTTP and HTTPS URLs are supported."
        );

        return;
    }


    showLoading();


    /*
     * The browser follows ordinary HTTP
     * redirects automatically.
     *
     * This is intended for URLs you own
     * or are authorized to redirect.
     */

    setTimeout(function () {

        window.location.assign(
            url.href
        );

    }, 500);

}


/* =====================================
   BULK URLS
===================================== */

function processBulk() {

    const value =
        input.value.trim();


    if (!value) {

        showError(
            "Please enter at least one URL."
        );

        return;
    }


    const urls =
        value
            .split(/[\n,]+/)
            .map(function (item) {
                return item.trim();
            })
            .filter(function (item) {
                return item.length > 0;
            });


    const validUrls = [];


    urls.forEach(function (value) {

        try {

            const url =
                new URL(value);


            if (
                url.protocol === "http:" ||
                url.protocol === "https:"
            ) {

                validUrls.push(
                    url.href
                );

            }

        } catch {

            // Invalid URL ignored

        }

    });


    if (validUrls.length === 0) {

        showError(
            "No valid HTTP or HTTPS URLs found."
        );

        return;
    }


    result.style.display =
        "block";


    resultText.innerHTML =
        '<span class="success">' +
        "✓ " +
        validUrls.length +
        " valid URL(s) found" +
        "</span>" +
        "<br><br>" +

        validUrls.map(function (url, index) {

            return (
                (index + 1) +
                ". " +
                '<a href="' +
                escapeHtml(url) +
                '" target="_blank" rel="noopener noreferrer">' +
                escapeHtml(url) +
                "</a>"
            );

        }).join("<br><br>");

}


/* =====================================
   SERVICE BUTTONS
===================================== */

document
    .querySelectorAll(".service")
    .forEach(function (service) {

        service.addEventListener(
            "click",
            function () {

                const name =
                    service.dataset.name;

                input.value = "";

                input.placeholder =
                    "Paste a " +
                    name +
                    " URL here...";

                input.focus();

                hideResult();

            }
        );

    });


/* =====================================
   LOADING
===================================== */

function showLoading() {

    result.style.display =
        "block";


    resultText.innerHTML =
        '<span class="loading">' +
        "Opening destination..." +
        "</span>";


    button.disabled =
        true;


    button.textContent =
        "Opening...";

}


/* =====================================
   ERROR
===================================== */

function showError(message) {

    result.style.display =
        "block";


    resultText.innerHTML =
        '<span class="error">' +
        escapeHtml(message) +
        "</span>";


    button.disabled =
        false;


    button.textContent =
        "Continue";

}


/* =====================================
   HIDE RESULT
===================================== */

function hideResult() {

    result.style.display =
        "none";


    resultText.innerHTML =
        "";


    button.disabled =
        false;


    button.textContent =
        "Continue";

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value) {

    const element =
        document.createElement("div");

    element.textContent =
        value;

    return element.innerHTML;

}

</script>

</body>
  </html>
