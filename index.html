<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZTE Bypass</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, #382080 0, transparent 35%),
        radial-gradient(circle at 80% 90%, #142d80 0, transparent 35%),
        #070914;
    color: white;
}

.nav {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(5,7,18,.65);
    backdrop-filter: blur(15px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: bold;
}

.logo-box {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg,#287cff,#8d4dff);
    box-shadow: 0 0 25px rgba(76,108,255,.35);
}

.main {
    max-width: 850px;
    margin: auto;
    padding: 85px 20px;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 30px;
    background: rgba(90,90,255,.12);
    border: 1px solid rgba(120,110,255,.25);
    color: #aeb8ff;
    font-size: 13px;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(40px, 7vw, 72px);
    line-height: 1;
    margin-bottom: 20px;
    background: linear-gradient(90deg,#fff,#a7b5ff,#8b62ff);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #a5abc4;
    font-size: 17px;
    margin-bottom: 38px;
}

.box {
    padding: 9px;
    border-radius: 18px;
    background: rgba(15,18,40,.8);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    color: white;
    background: transparent;
    padding: 18px;
    font-size: 15px;
}

input::placeholder {
    color: #626982;
}

button {
    border: 0;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.continue {
    padding: 0 25px;
    border-radius: 13px;
    background: linear-gradient(135deg,#347dff,#814cff);
    box-shadow: 0 8px 25px rgba(80,90,255,.3);
}

.continue:hover {
    filter: brightness(1.15);
}

.status {
    min-height: 25px;
    margin-top: 18px;
    color: #9299b3;
    font-size: 14px;
}

.services {
    margin-top: 55px;
}

.services h3 {
    margin-bottom: 18px;
    font-size: 15px;
    color: #8d94ac;
}

.chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.chip {
    padding: 10px 15px;
    border-radius: 30px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    color: #9ca4bd;
    font-size: 13px;
}

.stats {
    margin-top: 65px;
    display: flex;
    justify-content: center;
    gap: 60px;
}

.stat strong {
    display: block;
    font-size: 24px;
}

.stat span {
    color: #777f98;
    font-size: 12px;
}

@media(max-width:600px) {
    .box {
        flex-direction: column;
    }

    .continue {
        height: 52px;
    }

    .stats {
        gap: 30px;
    }

    .main {
        padding-top: 60px;
    }
}
</style>
</head>

<body>

<nav class="nav">
    <div class="logo">
        <div class="logo-box">Z</div>
        ZTE Bypass
    </div>
</nav>

<main class="main">

    <div class="badge">⚡ Fast Link Redirect</div>

    <h1>Skip the wait.<br>Get to the link.</h1>

    <p class="subtitle">
        Paste a supported URL below to continue.
    </p>

    <div class="box">
        <input
            id="urlInput"
            type="text"
            placeholder="Paste your link here..."
            autocomplete="off"
        >

        <button class="continue" onclick="continueLink()">
            Continue
        </button>
    </div>

    <div id="status" class="status"></div>

    <section class="services">
        <h3>SUPPORTED LINK TYPES</h3>

        <div class="chips">
            <div class="chip">Linkvertise</div>
            <div class="chip">LootLabs</div>
            <div class="chip">Work.ink</div>
            <div class="chip">Platoboost</div>
            <div class="chip">Short Links</div>
        </div>
    </section>

    <div class="stats">
        <div class="stat">
            <strong>⚡</strong>
            <span>FAST</span>
        </div>

        <div class="stat">
            <strong>🔒</strong>
            <span>SECURE</span>
        </div>

        <div class="stat">
            <strong>✓</strong>
            <span>SIMPLE</span>
        </div>
    </div>

</main>

<script>
function continueLink() {
    const input = document.getElementById("urlInput");
    const status = document.getElementById("status");

    let value = input.value.trim();

    if (!value) {
        status.textContent = "Please enter a link.";
        return;
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    try {
        const url = new URL(value);

        status.textContent = "Opening link...";

        /*
         * This follows ordinary browser redirects.
         * It does NOT decrypt or bypass LootLabs-protected
         * destination parameters.
         */
        window.location.href = url.href;

    } catch {
        status.textContent = "Invalid URL.";
    }
}

document.getElementById("urlInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        continueLink();
    }
});
</script>

</body>
</html>
